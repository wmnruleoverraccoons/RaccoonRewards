<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Coin Toss with Timestamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- html2canvas library for screenshots -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: rgba(255, 255, 255, 0.08); /* Kept for potential future use */
            --border-color: rgba(255, 255, 255, 0.2);
            --text-color: #e6f1ff;
            --highlight-color: #64ffda; /* User seems to have kept this */
            --shadow-color: rgba(10, 25, 47, 0.7);
            /* User's coin colors - keep them */
            --coin-gold: #a50e40; /* User changed heads background */
            --coin-silver: #c0c0c0; /* User kept tails background default */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Keep hidden for centered layout */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem; /* Base padding */
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(10, 25, 47, 0.6) 0%, rgba(10, 25, 47, 1) 80%);
            z-index: 1;
        }

        .floating-element {
            position: absolute;
            opacity: 0.2;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .floating-element.feather {
            background-image: url('https://wmnruleoverraccoons.github.io/RaccoonRewards/feather_image_png_transparent.png');
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); opacity: 0.2; }
            50% { transform: translateY(-20px) translateX(-20px) rotate(180deg) scale(1); opacity: 0.25;}
            100% { transform: translateY(0px) translateX(0px) rotate(360deg) scale(1); opacity: 0.2; }
        }
        
        #capture-area {
             padding: 20px;
             display: inline-block;
             /* Removed background color override from previous merge to use default body gradient */
             border-radius: 10px;
             margin-bottom: 1rem;
             /* Added effects from user's index.html card styles */
             border: 1px solid var(--border-color);
             box-shadow: 0 8px 32px 0 var(--shadow-color);
             backdrop-filter: blur(10px); /* Using card's blur */
             -webkit-backdrop-filter: blur(10px);
        }

        .coin-container {
            perspective: 1000px;
            margin-bottom: 1rem;
            width: 150px;
            height: 150px;
            margin-left: auto;
            margin-right: auto;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            -webkit-backface-visibility: hidden;
            background-size: 80%;
            background-repeat: no-repeat;
            background-position: center;
            color: transparent; /* Text unsichtbar */
        }

        .coin-face--front { /* Heads - User defined */
            background-image: url('https://wmnruleoverraccoons.github.io/RaccoonRewards/coin_toss_raccoon_heads.png');
            background-color: #a50e40; /* User color */
            box-shadow: 0 0 15px rgba(199, 1, 143, 0.767), inset 0 0 10px rgba(0,0,0,0.3); /* User shadow */
        }

        .coin-face--back { /* Tails - User defined */
            background-image: url('https://wmnruleoverraccoons.github.io/RaccoonRewards/coin_toss_raccoon_tails.png');
            background-color: #c0c0c0; /* User kept default? */
            transform: rotateY(180deg);
            box-shadow: 0 0 15px rgba(17, 155, 67, 0.744), inset 0 0 10px rgba(0,0,0,0.3); /* User shadow */
        }
        
         .action-button {
             background: #4d4dff;
             color: white;
             border-radius: 8px;
             font-weight: bold;
             cursor: pointer;
             transition: background-color 0.3s, transform 0.1s, opacity 0.3s;
             padding: 0.75rem 1.5rem;
             margin: 0.5rem;
             border: none;
             font-size: 1rem;
        }
        .action-button:hover {
            background-color: #3b3be6;
        }
        .action-button:active {
            transform: scale(0.95);
        }
         .action-button:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        #save-button {
            background-color: var(--highlight-color);
            color: var(--bg-color);
            opacity: 0;
            pointer-events: none;
        }
         #save-button.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #save-button:hover {
             background-color: #50e0c0;
        }

        #result-display {
            margin-top: 0.5rem;
            font-size: 1.25rem;
            min-height: 3.5em;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #result-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }
        #timestamp-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 0.5rem;
        }

        /* --- Responsive Design (Copied from previous version) --- */
        @media (max-width: 640px) {
            body {
                align-items: flex-start; /* Align content to top on small screens */
                padding-top: 2rem;
                overflow-y: auto; /* Allow scrolling on mobile if needed */
            }
            main {
                 padding: 1rem;
            }
             h1 {
                font-size: 2.25rem; /* text-4xl */
                margin-bottom: 2rem;
            }
             #capture-area {
                 padding: 15px;
             }

            .coin-container {
                width: 120px;
                height: 120px;
            }
             .coin-face {
                 background-size: 75%;
             }

            #result-display {
                min-height: 3em;
            }
             #result-text {
                font-size: 1.25rem; /* text-xl */
            }
            #timestamp-text {
                font-size: 0.7rem;
            }

            .action-button {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
                margin: 0.3rem;
            }
        }
        /* Specific tweaks for very small screens like iPhone SE */
         @media (max-width: 380px) {
              h1 {
                font-size: 1.875rem; /* text-3xl */
              }
             .coin-container {
                width: 100px;
                height: 100px;
             }
              .action-button {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
             #result-text {
                font-size: 1.1rem;
            }
            #timestamp-text {
                font-size: 0.65rem;
            }
         }

    </style>
</head>
<body> <!-- Body padding handled by media query and base style -->
    <div id="background-container" class="background-container"></div>

    <main class="w-full max-w-md p-6"> <!-- Added p-6 back -->
        <h1 class="text-4xl sm:text-5xl font-bold mb-6" style="font-family: 'Playfair Display', serif;">Nerding out again</h1> <!-- User title -->

        <!-- Area to capture for screenshot -->
        <div id="capture-area">
            <div class="coin-container">
                <div id="coin" class="coin">
                    <!-- Text removed as images are used -->
                    <div class="coin-face coin-face--front"></div>
                    <div class="coin-face coin-face--back"></div>
                </div>
            </div>
            <div id="result-display">
                <p id="result-text">&nbsp;</p>
                <p id="timestamp-text">&nbsp;</p>
            </div>
        </div>
        
        <div>
             <button id="flip-button" class="action-button">Flip Coin</button>
             <button id="save-button" class="action-button">Save Result</button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const coinElement = document.getElementById('coin');
            const flipButton = document.getElementById('flip-button');
            const saveButton = document.getElementById('save-button');
            const resultText = document.getElementById('result-text');
            const timestampText = document.getElementById('timestamp-text');
            const captureArea = document.getElementById('capture-area');

            let isFlipping = false;
            let currentResult = 'Heads';
            let flipTimestamp = null;

            function flipCoin() {
                if (isFlipping) return;

                isFlipping = true;
                flipButton.disabled = true;
                saveButton.classList.remove('visible');
                resultText.textContent = "Flipping...";
                timestampText.textContent = '\u00A0';

                const result = Math.random() < 0.5 ? 'Heads' : 'Tails';
                flipTimestamp = new Date();

                animateFlip(result);
            }

            function animateFlip(result) {
                const randomFlips = Math.floor(Math.random() * 3) + 4;
                const finalRotation = result === 'Heads' ? 0 : 180;
                const totalRotation = randomFlips * 360 + finalRotation;

                coinElement.style.transform = `rotateY(${totalRotation}deg)`;

                setTimeout(() => {
                    displayResult(result);
                    isFlipping = false;
                    flipButton.disabled = false;
                    saveButton.classList.add('visible');
                }, 1000);
            }

            function displayResult(result) {
                currentResult = result;
                coinElement.style.transition = 'none';
                if (result === 'Heads') {
                    coinElement.style.transform = 'rotateY(0deg)';
                    resultText.textContent = "It's Heads!";
                } else {
                    coinElement.style.transform = 'rotateY(180deg)';
                    resultText.textContent = "It's Tails!";
                }
                
                // Keep German timestamp format from user's code
                timestampText.textContent = `Flipped on: ${flipTimestamp.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'medium' })}`;

                setTimeout(() => {
                    coinElement.style.transition = 'transform 1s cubic-bezier(0.4, 0.0, 0.2, 1)';
                }, 50);
            }

            function saveResultAsImage() {
                if (!flipTimestamp || isFlipping) return;

                 const options = {
                    backgroundColor: getComputedStyle(document.body).backgroundColor,
                    useCORS: true // Important for external images
                 };

                html2canvas(captureArea, options).then(canvas => {
                    const imageData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imageData;
                    
                    const now = flipTimestamp;
                    const dateStr = now.toISOString().split('T')[0];
                    const timeStr = now.toTimeString().split(' ')[0].replace(/:/g, '-');
                    
                    let resultWord = 'result';
                    const resultMatch = resultText.textContent.match(/It's (\w+)!/);
                    if (resultMatch && resultMatch[1]) {
                        resultWord = resultMatch[1].toLowerCase();
                    }
                    
                    link.download = `coin_toss_${resultWord}_${dateStr}_${timeStr}.png`;

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }).catch(err => {
                    console.error("Error generating screenshot:", err);
                    // Use a more user-friendly error message if possible
                     resultText.textContent = "Error saving image.";
                     timestampText.textContent = "Please try again.";
                });
            }

            // --- Event Listeners ---
            flipButton.addEventListener('click', flipCoin);
            saveButton.addEventListener('click', saveResultAsImage);

            // --- Background Animation (Feathers) ---
            function createBackgroundAnimation() {
                const bgContainer = document.getElementById('background-container');
                bgContainer.innerHTML = '';
                const numElements = 30; // Consistent number
                for (let i = 0; i < numElements; i++) {
                    const el = document.createElement('div');
                    el.className = `floating-element feather`;
                    el.style.left = `${Math.random() * 100}vw`;
                    el.style.top = `${Math.random() * 100}vh`;
                    const size = Math.random() * 40 + 30; // Consistent size
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.style.animationDuration = `${Math.random() * 25 + 20}s`;
                    el.style.animationDelay = `${Math.random() * 15}s`;
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    bgContainer.appendChild(el);
                }
            }
            createBackgroundAnimation();

            // Initial display state
            resultText.textContent = "Ready to flip!";
            timestampText.innerHTML = '&nbsp;';
            
        });
    </script>
</body>
</html>
