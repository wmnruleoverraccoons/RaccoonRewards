<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Miss-Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.2);
            --text-color: #e6f1ff;
            --correct-color: #16a34a; /* Green-600 */
            --incorrect-color: #dc2626; /* Red-600 */
            --shadow-color: rgba(10, 25, 47, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-y: auto;
            min-height: 100vh;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(10, 25, 47, 0.6) 0%, rgba(10, 25, 47, 1) 80%);
            z-index: 1;
        }

        .floating-element {
            position: absolute;
            opacity: 0.2;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .floating-element.feather {
            background-image: url('https://wmnruleoverraccoons.github.io/RaccoonRewards/feather_image_png_transparent.png');
        }
        
        .raccoon-icon {
             filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); opacity: 0.2; }
            50% { transform: translateY(-20px) translateX(-20px) rotate(180deg) scale(1); opacity: 0.25;}
            100% { transform: translateY(0px) translateX(0px) rotate(360deg) scale(1); opacity: 0.2; }
        }

        .quiz-container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #question {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            margin-bottom: 2rem;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .btn:hover:not([disabled]) {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-color);
        }

        .btn.incorrect {
            background-color: var(--incorrect-color);
            border-color: var(--incorrect-color);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        #next-btn {
            display: none; /* Hidden by default */
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            background: #4d4dff;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #next-btn:hover {
            background-color: #3b3be6;
        }
        
        .result-screen h2 {
            font-family: 'Playfair Display', serif;
        }
        
        .password-reveal {
            margin-top: 2rem;
            padding: 1rem;
            background-color: rgba(0,0,0,0.3);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }
        
        .password-reveal span {
            font-weight: bold;
            color: var(--highlight-color);
            letter-spacing: 2px;
            background: #112240;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div id="background-container" class="background-container"></div>
    
    <main>
        <div class="quiz-container">
            <div class="flex justify-center items-center gap-4 mb-4">
                 <img src="https://wmnruleoverraccoons.github.io/RaccoonRewards/raccoon_image_png_transparent.jpg" alt="Raccoon Symbol" class="w-16 h-16 raccoon-icon">
                <h1 class="text-4xl sm:text-5xl font-bold" style="font-family: 'Playfair Display', serif;">The Miss-Quiz</h1>
            </div>
            <hr class="border-gray-600 my-6">

            <div id="quiz-body">
                <h2 id="question">Question goes here</h2>
                <div id="options-container">
                    <!-- Buttons will be generated by JS -->
                </div>
                <button id="next-btn">Next</button>
            </div>
            
            <div id="result-screen" class="hidden text-center">
                <h2 class="text-3xl mb-4">Quiz Complete!</h2>
                <p class="text-lg mb-4">You scored <span id="score">0</span> out of 20.</p>
                <p class="mb-4">The most important thing isn't the score, but understanding that with me, your boundaries are paramount and consent is everything. You are safe here.</p>
                <div class="password-reveal">
                    <p class="mb-2">Here is the password for the next card:</p>
                    <span id="final-password">PASSWORD</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- CONFIGURATION ---
            const finalPassword = "TRUST2024"; // Change this to your desired password

            const questions = [
                // --- About Consent & Safety ---

                    ]
                },
                {

                    answers: [
                        { text: "Yes, it's a permanent agreement", correct: false },
                        { text: "Only if the scene was good", correct: false },
                        { text: "No, consent is an ongoing process and must be renegotiated", correct: true },
                        { text: "Yes, unless the sub explicitly revokes it", correct: false }
                    ]
                },
                {
                    question: "Who is ultimately responsible for defining and enforcing a submissive's limits?",
                    answers: [
                        { text: "The Dominant, as they are in control", correct: false },
                        { text: "The submissive, by clearly communicating them", correct: true },
                        { text: "The BDSM community rules", correct: false },
                        { text: "Whoever is more experienced", correct: false }
                    ]
                },
                {
                    question: "What is the most important element in any healthy D/s dynamic?",
                    answers: [
                        { text: "Strict rules", correct: false },
                        { text: "Constant intensity", correct: false },
                        { text: "Trust and Communication", correct: true },
                        { text: "A 24/7 power exchange", correct: false }
                    ]
                },
                 {
                    question: "What is Aftercare?",
                    answers: [
                        { text: "Cleaning up equipment after a scene", correct: false },
                        { text: "A review of the sub's performance", correct: false },
                        { text: "Emotional and physical care for both partners after a scene", correct: true },
                        { text: "Planning the next session", correct: false }
                    ]
                },
                {
                    question: "If a Dom/me ignores a safeword, this is considered...",
                    answers: [
                        { text: "Part of an intense scene", correct: false },
                        { text: "A test of the sub's limits", correct: false },
                        { text: "Unacceptable and a form of assault", correct: true },
                        { text: "A sign of a 'true' dominant", correct: false }
                    ]
                },
                 // --- About Our Dynamic ---
                {
                    question: "What is Miss's number one, non-negotiable rule?",
                    answers: [
                        { text: "Perfect obedience at all times", correct: false },
                        { text: "Your safety and well-being come first, always", correct: true },
                        { text: "Completing every task, no matter what", correct: false },
                        { text: "Never questioning an order", correct: false }
                    ]
                },
                {
                    question: "If you are ever unsure or uncomfortable with something, what is the right thing to do?",
                    answers: [
                        { text: "Push through it to please Miss", correct: false },
                        { text: "Hope Miss notices and stops on her own", correct: false },
                        { text: "Communicate it immediately, using a safeword if needed", correct: true },
                        { text: "Apologize for being difficult", correct: false }
                    ]
                },
                {
                    question: "The boundaries in our dynamic are determined by...",
                    answers: [
                        { text: "Miss's desires alone", correct: false },
                        { text: "What we see others doing online", correct: false },
                        { text: "Mutual discussion, enthusiastic consent, and your stated limits", correct: true },
                        { text: "An online checklist of common kinks", correct: false }
                    ]
                },
                // --- Placeholder questions about Miss (for you to edit) ---
                 {
                    question: "What is one of Miss's 'hard limits'?",
                    answers: [
                        { text: "Example: Permanent marking", correct: true },
                        { text: "Example: Being too gentle", correct: false },
                        { text: "Example: Long conversations", correct: false },
                        { text: "Example: Vanilla activities", correct: false }
                    ]
                },
                 {
                    question: "What is something Miss finds incredibly endearing about you?",
                    answers: [
                        { text: "Example: Your laugh", correct: true },
                        { text: "Example: Your taste in movies", correct: false },
                        { text: "Example: Your coding skills", correct: false },
                        { text: "Example: Your cooking", correct: false }
                    ]
                },
                {
                    question: "What's Miss's favorite color?",
                    answers: [
                        { text: "Red", correct: false },
                        { text: "Blue", correct: true },
                        { text: "Black", correct: false },
                        { text: "Purple", correct: false }
                    ]
                },
                {
                    question: "What is Miss's preferred form of aftercare to give?",
                    answers: [
                        { text: "Example: Cuddling and soft words", correct: true },
                        { text: "Example: A stern debriefing", correct: false },
                        { text: "Example: Leaving you alone to process", correct: false },
                        { text: "Example: Discussing what went wrong", correct: false }
                    ]
                },
                 {
                    question: "What is a sign that Miss is genuinely pleased with you?",
                    answers: [
                        { text: "She becomes silent", correct: false },
                        { text: "She uses a specific praise word", correct: true },
                        { text: "She ends the session immediately", correct: false },
                        { text: "She assigns another task right away", correct: false }
                    ]
                },
                 // --- More General Questions ---
                {
                    question: "The term 'BDSM' is an acronym for...",
                    answers: [
                        { text: "Bondage & Discipline, Dominance & Submission, Sadism & Masochism", correct: true },
                        { text: "Boundaries, Discipline, Safety, and More", correct: false },
                        { text: "Being Dom, Serving More", correct: false },
                        { text: "None of the above", correct: false }
                    ]
                },
                 {
                    question: "True or False: A submissive has no real power in a dynamic.",
                    answers: [
                        { text: "True, that's the point of submission", correct: false },
                        { text: "False, the submissive holds the ultimate power by giving consent", correct: true }
                    ]
                },
                 {
                    question: "What does 'subspace' commonly refer to?",
                    answers: [
                        { text: "A physical dungeon or playroom", correct: false },
                        { text: "A designated corner for punishments", correct: false },
                        { text: "An altered state of consciousness during a scene", correct: true },
                        { text: "An online forum for submissives", correct: false }
                    ]
                },
                {
                    question: "Is it okay for your limits to change over time?",
                    answers: [
                        { text: "No, limits must be set in stone from the beginning", correct: false },
                        { text: "Yes, and it's important to communicate any changes to your partner", correct: true },
                        { text: "Only if the dominant agrees to the changes", correct: false },
                        { text: "Yes, but you should feel guilty about it", correct: false }
                    ]
                },
                {
                    question: "What is the key takeaway from your past experiences when entering our dynamic?",
                    answers: [
                        { text: "That all Dommes are unpredictable", correct: false },
                        { text: "That my needs for breaks and boundaries are valid and will be respected here", correct: true },
                        { text: "That I should be more resilient to pain and humiliation", correct: false },
                        { text: "That online dynamics are never real", correct: false }
                    ]
                },
            ];

            const questionElement = document.getElementById('question');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');
            const quizBody = document.getElementById('quiz-body');
            const resultScreen = document.getElementById('result-screen');
            const scoreElement = document.getElementById('score');
            const finalPasswordElement = document.getElementById('final-password');

            let currentQuestionIndex = 0;
            let score = 0;

            function startQuiz() {
                currentQuestionIndex = 0;
                score = 0;
                nextBtn.innerHTML = "Next";
                finalPasswordElement.textContent = finalPassword;
                showQuestion();
            }

            function showQuestion() {
                resetState();
                let currentQuestion = questions[currentQuestionIndex];
                let questionNo = currentQuestionIndex + 1;
                questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

                currentQuestion.answers.forEach(answer => {
                    const button = document.createElement("button");
                    button.innerHTML = answer.text;
                    button.classList.add("btn");
                    optionsContainer.appendChild(button);
                    if (answer.correct) {
                        button.dataset.correct = answer.correct;
                    }
                    button.addEventListener("click", selectAnswer);
                });
            }

            function resetState() {
                nextBtn.style.display = "none";
                while (optionsContainer.firstChild) {
                    optionsContainer.removeChild(optionsContainer.firstChild);
                }
            }

            function selectAnswer(e) {
                const selectedBtn = e.target;
                const isCorrect = selectedBtn.dataset.correct === "true";
                if (isCorrect) {
                    selectedBtn.classList.add("correct");
                    score++;
                } else {
                    selectedBtn.classList.add("incorrect");
                }

                Array.from(optionsContainer.children).forEach(button => {
                    if (button.dataset.correct === "true") {
                        button.classList.add("correct");
                    }
                    button.disabled = true;
                });
                nextBtn.style.display = "block";
            }

            function showScore() {
                quizBody.classList.add('hidden');
                resultScreen.classList.remove('hidden');
                scoreElement.textContent = score;
            }

            function handleNextButton() {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    showScore();
                }
            }

            nextBtn.addEventListener("click", () => {
                if (currentQuestionIndex < questions.length) {
                    handleNextButton();
                }
            });

            // --- Background Animation ---
            function createBackgroundAnimation() {
                const bgContainer = document.getElementById('background-container');
                const numElements = 30;
                for (let i = 0; i < numElements; i++) {
                    const el = document.createElement('div');
                    el.className = `floating-element feather`;
                    el.style.left = `${Math.random() * 100}vw`;
                    el.style.top = `${Math.random() * 100}vh`;
                    const size = Math.random() * 50 + 40;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.style.animationDuration = `${Math.random() * 25 + 20}s`;
                    el.style.animationDelay = `${Math.random() * 15}s`;
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    bgContainer.appendChild(el);
                }
            }
            
            createBackgroundAnimation();
            startQuiz();
        });
    </script>
</body>
</html>
